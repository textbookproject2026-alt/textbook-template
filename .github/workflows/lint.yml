# Markdown lint on every change. A book-level check: it reads nothing but this
# repository, needs no secret, and says nothing about the platform.
name: lint

on:
  push:
  pull_request:
  # The Sunday community pull requests start it this way: a pull request the
  # workflow token opens starts no pull_request runs, and lint is required on main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
