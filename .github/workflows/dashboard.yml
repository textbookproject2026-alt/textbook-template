name: Update dashboard

# community/dashboard.md, the project health page. With no HYPOTHESIS_API_TOKEN the
# public layer is counted anonymously, which is all of a book's margin unless it has
# annotation groups.
# The job is the platform's: quartz-book's book-community-page.yml, called at `stable`
# (BOOK-ONE-TO-QUARTZ §8 steps 14 and 23). Skipped in the template repo itself.
on:
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  dashboard:
    if: github.repository != 'textbookproject2026-alt/textbook-template'
    uses: textbookproject2026-alt/quartz-book/.github/workflows/book-community-page.yml@stable
    with:
      page: dashboard
    secrets:
      HYPOTHESIS_API_TOKEN: ${{ secrets.HYPOTHESIS_API_TOKEN }}
