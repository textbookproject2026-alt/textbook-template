# Regenerates the managed files when the config, a template or the renderer changes
# in a pull request, and commits the result back into the pull request so the change
# lands complete.
#
# It also runs on a schedule. The reason is a gap the pull-request trigger cannot
# close: a registry change alone never triggers a render, so a merged registry change
# (a new domain, a new relay) reaches the generated files only the next time somebody
# happens to touch a template. A weekly run opens a pull request when the registry has
# moved on without this repo.
#
# Book one's copy of this workflow gained the same run on 22 Sep 2026, and went one
# step further: its scheduled pull request arms auto-merge when every file it changes
# is a generated one. That is worth having in a book whose main is branch-protected
# and whose chore pull requests otherwise pile up. It is deliberately NOT here — a
# fresh template repo has no protection to satisfy and no history of chores, so the
# first thing a new maintainer should see is the diff, not a merge that already
# happened. Copy it from the vault if and when this book has the same problem.
name: Apply config

on:
  pull_request:
    paths:
      - textbook.config.json
      - templates/**
      - configure.mjs
  schedule:
    - cron: "0 7 * * 1" # 07:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    # The template itself ships with an empty slug by design, so a render here can
    # only fail. Skip it in the template; repos made from it have a different name
    # and run it as normal.
    if: github.repository != 'textbookproject2026-alt/textbook-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # On a pull request, check out its own branch so the render can be
          # committed back to it.
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
          path: book

      # configure.mjs prefers ../textbook-registry/registry.json, so check the
      # registry out beside the book: the same layout as a local clone, and it
      # pins the render to a commit this run can name.
      - uses: actions/checkout@v5
        with:
          repository: textbookproject2026-alt/textbook-registry
          path: textbook-registry

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: node configure.mjs
        working-directory: book

      - name: Commit regenerated files (pull request)
        if: github.event_name == 'pull_request'
        working-directory: book
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to update."
          else
            git commit -m "Apply config to generated files"
            git push
          fi

      # On a schedule there is no pull request to commit into, and the live branch
      # is protected. A branch plus a pull request is the only route onto it — the
      # same answer book one's weekly jobs reached.
      - name: Propose the render (schedule)
        if: github.event_name != 'pull_request'
        working-directory: book
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "The generated files already match the registry. Nothing to propose."
            exit 0
          fi
          branch=chore/apply-config
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Apply config to generated files"
          git push --force origin "$branch"
          # A pull request already open for this branch was just updated in place.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" \
              --title "Apply config to generated files" \
              --body "The registry has changed since these files were last rendered. Generated by \`configure.mjs\`; review the diff, then merge."
          fi
